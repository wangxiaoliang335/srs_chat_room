user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log crit;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

stream {
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Use the TCP peer, never a client-supplied forwarding header or SNI.
    limit_conn_zone $binary_remote_addr zone=rtmps_source:1m;
    limit_conn_zone rtmps zone=rtmps_total:1m;

    server {
        listen 1936 ssl;
        limit_conn rtmps_source 16;
        limit_conn rtmps_total 40;
        ssl_certificate /etc/chat-tls/fullchain.pem;
        ssl_certificate_key /etc/chat-tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_handshake_timeout 5s;

        proxy_connect_timeout 3s;
        proxy_timeout 180s;
        set $srs_rtmp srs:1935;
        proxy_pass $srs_rtmp;
    }
}

http {
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;
    # The HTTPS edge is the peer for all FLV viewers. Host must not split this quota.
    limit_conn_zone flv zone=flv_total:1m;

    server {
        listen 8080;
        set $chat_api http://chat-api:8085;
        set $srs_flv http://srs:8080;

        location ~ "^/live/(?<media_stream>[0-9]{1,20}\.[a-f0-9]{12})\.flv$" {
            # 40 RTMPS + 40 FLV leaves 20 of SRS's 100 TCP slots for control traffic.
            limit_conn flv_total 40;
            limit_conn_status 429;
            limit_except GET { deny all; }
            set $media_query $args;
            auth_request /_authorize_flv;

            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 180s;
            proxy_pass $srs_flv$uri?srs_ticket=$arg_srs_ticket;
        }

        location = /_authorize_flv {
            internal;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Media-Stream $media_stream;
            proxy_set_header X-Media-Query $media_query;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            proxy_pass $chat_api/internal/media/flv-auth;
        }

        location / {
            return 404;
        }
    }
}
