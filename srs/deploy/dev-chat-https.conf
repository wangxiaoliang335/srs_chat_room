limit_req_zone $binary_remote_addr zone=chat_dev_auth:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=chat_dev_rtc:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name chat-dev.aloveltd.cn;
    access_log off;
    return 426;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat-dev.aloveltd.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/chat-dev.aloveltd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-dev.aloveltd.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $chat_api http://chat-api:8085;
    set $chat_media http://chat-media:8080;

    access_log off;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 128k;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/v1/app/verify {
        limit_req zone=chat_dev_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $chat_api$uri;
    }
    location = /api/v1/auth/login {
        limit_req zone=chat_dev_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $chat_api$uri;
    }
    location ~ ^/api/v1/(?:auth/(?:me|logout|logout-all)|me/rooms|rooms?|users|shares?|invites?|notifications|messages)(?:/|$) {
        proxy_pass $chat_api$uri$is_args$args;
    }
    location = /ws {
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $edge_connection_upgrade;
        proxy_read_timeout 180s;
        proxy_pass $chat_api$uri$is_args$args;
    }
    location ~ ^/rtc/v1/(?:play|publish)/$ {
        limit_req zone=chat_dev_rtc burst=20 nodelay;
        limit_req_status 429;
        proxy_pass $chat_api$uri;
    }
    location ~ "^/live/[0-9]{1,20}\.[a-f0-9]{12}\.flv$" {
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_pass $chat_media$uri$is_args$args;
    }
    location / {
        return 404;
    }
}
